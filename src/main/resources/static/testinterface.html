<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Riftlog — debug</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
  th, td { text-align: left; padding: 0.4rem; border-bottom: 1px solid #ddd; }
  .win { color: green; }
  .loss { color: crimson; }
</style>
</head>
<body>

<h1>Riftlog — manual check</h1>
<p>Minimal debug page: shows exactly what the API returns, nothing more.</p>

<h2>Stats</h2>
<pre id="stats">loading...</pre>

<h2>Matches</h2>
<table>
  <thead>
    <tr><th>Date</th><th>Opponent</th><th>My deck</th><th>Their deck</th><th>Result</th><th>Score</th></tr>
  </thead>
  <tbody id="matches">
    <tr><td colspan="6">loading...</td></tr>
  </tbody>
</table>

<script>
async function load() {
  const stats = await fetch('/api/stats').then(r => r.json());
  document.getElementById('stats').textContent = JSON.stringify(stats, null, 2);

  const matches = await fetch('/api/matches').then(r => r.json());
  const rows = matches.map(m => `
    <tr>
      <td>${new Date(m.playedAt).toLocaleString()}</td>
      <td>${m.opponentName}</td>
      <td>${m.myDeckName}</td>
      <td>${m.opponentDeckName}</td>
      <td class="${m.result === 'WIN' ? 'win' : 'loss'}">${m.result}</td>
      <td>${m.myFinalScore} - ${m.opponentFinalScore}</td>
    </tr>
  `).join('');
  document.getElementById('matches').innerHTML = rows || '<tr><td colspan="6">No matches logged yet</td></tr>';
}

load();
</script>

</body>
</html>
