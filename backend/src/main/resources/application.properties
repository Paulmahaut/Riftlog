spring.application.name=riftlog

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/riftlog}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:riftlog}
spring.datasource.password=${DB_PASSWORD:riftlog}

spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# HS256 needs a secret >= 256 bits. This dev default is fine for coursework;
# override with the JWT_SECRET env var for any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-riftlog-secret-key-change-me-please-1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
