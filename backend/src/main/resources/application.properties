spring.config.import=optional:file:.env[.properties]

spring.application.name=riftlog


# Render (and most PaaS) inject the port to bind to via $PORT; default to 8080 for local dev.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL::jdbc:postgresql://localhost:5432/riftlog}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:Riftlog}
spring.datasource.password=${DB_PASSWORD:Riftlog}

spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# HS256 needs a secret >= 256 bits. This dev default is fine for coursework;
# override with the JWT_SECRET env var for any real deployment.
app.jwt.secret=${JWT_SECRET:dev-only-riftlog-secret-key-change-me-please-1234567890}
# 30 days: the phone app is used offline at the table and must not log people out between game nights.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

# Comma-separated list of origins the browser is allowed to call this API from.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Lazy collections (players, games, legends) are loaded in batches instead of one query each.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.open-in-view=false

# Card data: copied from Riftcodex (unofficial fan API) into the cards table.
# On startup, the import only runs when the table is empty; POST /api/cards/import refreshes it.
app.riftcodex.base-url=${RIFTCODEX_BASE_URL:https://api.riftcodex.com}
app.cards.import-on-startup=${CARDS_IMPORT_ON_STARTUP:true}
