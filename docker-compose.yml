services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: riftlog
      POSTGRES_USER: riftlog
      POSTGRES_PASSWORD: riftlog
    ports:
      - "5432:5432"
    volumes:
      - riftlog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riftlog -d riftlog"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  riftlog-db-data:
